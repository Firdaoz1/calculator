<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>calc</title>
   <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="index.js" defer></script>
</head>
<body>
  <div class="flex justify-center items-center h-screen p-4">
    <div class="bg-black text-white p-4 w-full max-w-[300px] md:max-w-[500px] rounded-xl">
 <input type="text" autofocus class="w-full h-[150px] mb-2 text-[3rem] text-white outline-none text-right border-b border-b-gray-100 font-semibold caret-[#22f022] md:h-[250px]">

 <div class="flex flex-col gap-4 pt-10 justify-center items-center">
  <div class="grid grid-cols-4 gap-5">
  <button class="flex justify-center items-center bg-[#d3d3d32d] w-10 h-10 p-8 rounded-full font-semibold text-[24px] md:p-10">C</button>
  <button class="flex justify-center items-center bg-[#d3d3d32d] w-10 h-10 p-8 rounded-full font-semibold text-[24px] md:p-10">%</button>
  <button class="flex justify-center items-center bg-[#d3d3d32d] w-10 h-10 p-8 rounded-full font-semibold text-[24px] md:p-10">x</button>
  <button class="flex justify-center items-center bg-[#d3d3d397] w-10 h-10 p-8 rounded-full font-semibold text-[24px] text-black md:p-10">/</button>
 </div> 

 <div class="grid grid-cols-4 gap-5">
  <button class="flex justify-center items-center bg-[#d3d3d313] w-10 h-10 p-8 rounded-full font-semibold text-[24px] md:p-10">7</button>
  <button class="flex justify-center items-center bg-[#d3d3d313] w-10 h-10 p-8 rounded-full font-semibold text-[24px] md:p-10">8</button>
  <button class="flex justify-center items-center bg-[#d3d3d313] w-10 h-10 p-8 rounded-full font-semibold text-[24px] md:p-10">9</button>
  <button class="flex justify-center items-center bg-[#d3d3d397] w-10 h-10 p-8 rounded-full font-semibold text-[24px] text-black md:p-10">*</button>
 </div> 

 <div class="grid grid-cols-4 gap-5">
  <button class="flex justify-center items-center bg-[#d3d3d313] w-10 h-10 p-8 rounded-full font-semibold text-[24px] md:p-10">4</button>
  <button class="flex justify-center items-center bg-[#d3d3d313] w-10 h-10 p-8 rounded-full font-semibold text-[24px] md:p-10">5</button>
  <button class="flex justify-center items-center bg-[#d3d3d313] w-10 h-10 p-8 rounded-full font-semibold text-[24px] md:p-10">6</button> 
  <button class="flex justify-center items-center bg-[#d3d3d397] w-10 h-10 p-8 rounded-full font-semibold text-[24px] text-black md:p-10">-</button>
 </div> 

 <div class="grid grid-cols-4 gap-5">
  <button class="flex justify-center items-center bg-[#d3d3d313] w-10 h-10 p-8 rounded-full font-semibold text-[24px] md:p-10">1</button>
  <button class="flex justify-center items-center bg-[#d3d3d313] w-10 h-10 p-8 rounded-full font-semibold text-[24px] md:p-10">2</button>
  <button class="flex justify-center items-center bg-[#d3d3d313] w-10 h-10 p-8 rounded-full font-semibold text-[24px] md:p-10">3</button>
  <button class="flex justify-center items-center bg-[#d3d3d397] w-10 h-10 p-8 rounded-full font-semibold text-[24px] text-black md:p-10" value="+">+</button>
 </div> 

 <div class="grid grid-cols-4 gap-5 mb-3">
  <button class="flex justify-center items-center bg-[#d3d3d313] w-10 h-10 p-8 rounded-full font-semibold text-[24px] md:p-10">0</button>
  <button class="flex justify-center items-center bg-[#d3d3d313] w-10 h-10 p-8 rounded-full font-semibold text-[24px] md:p-10">.</button>
  <button class="col-span-2 bg-[#22f022] rounded-xl font-semibold text-[24px]md:p-10">=</button>
 </div>
 </div> 
 </div>
 </div>
 
 <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>
</html>
